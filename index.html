<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MP Distribuciones | Distribuidor Mayorista de Informática - Rosario, Santa Fe</title>
    <meta name="description" content="Portal Mayorista B2B de informática, conectividad, periféricos, hardware y accesorios en Rosario, Santa Fe. Precios de gremio directos para distribuidores y locales." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f1f5f9] text-slate-900 min-h-screen selection:bg-blue-600 selection:text-white antialiased font-sans">
    <!-- Dummy elements to trigger immediate early return in Netlify HUD/Badge injector -->
    <div id="nl-badge-frame" style="display:none!important;visibility:hidden!important;width:0!important;height:0!important;position:absolute!important;left:-9999px!important"></div>
    <div id="nl-hud-frame" style="display:none!important;visibility:hidden!important;width:0!important;height:0!important;position:absolute!important;left:-9999px!important"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var removeBadge = function () {
          var b = document.getElementById('nl-badge-frame');
          if (b && b.tagName === 'IFRAME') b.remove();
          var f = document.getElementById('nl-hud-frame');
          if (f && f.tagName === 'IFRAME') f.remove();
          var s = document.querySelector('script[data-nf-variant]');
          if (s) s.remove();
        };
        try {
          var obs = new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var nodes = mutations[i].addedNodes;
              for (var j = 0; j < nodes.length; j++) {
                var node = nodes[j];
                if (node.id === 'nl-badge-frame' || node.id === 'nl-hud-frame' || (node.tagName === 'IFRAME' && (node.id || '').indexOf('nl-') !== -1)) {
                  if (node.tagName === 'IFRAME') node.remove();
                }
              }
            }
          });
          obs.observe(document.documentElement, { childList: true, subtree: true });
          setTimeout(function () { obs.disconnect(); }, 4000);
        } catch (e) {}
        window.addEventListener('DOMContentLoaded', removeBadge);
        window.addEventListener('load', removeBadge);
      })();
    </script>
  </body>
</html>
